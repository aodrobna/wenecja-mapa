name: Opublikuj mapę (GitHub Pages)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
      - name: Skonfiguruj Pages
        uses: actions/configure-pages@v5
      - name: Wyślij pliki strony
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Opublikuj
        id: deployment
        uses: actions/deploy-pages@v4
